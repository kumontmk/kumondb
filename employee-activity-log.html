<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Employee Activity Log - Kumon DB</title>

  <link rel="stylesheet" href="employee-activity-log.css" />
</head>
<body>

  <header>
    <nav>
      <a href="centers.html" class="header-link">← Centers</a>
    </nav>
    <h1>👥 Employee Activity Log</h1>
  </header>

  <div id="page-loader">
    <div class="spinner"></div>
    <p>Loading activity logs...</p>
  </div>

  <main class="form-container">

    <section class="filter-panel">
      <h2>Filters</h2>

      <div class="controls">

        <div class="control-group">
          <label class="control-label" for="dateFrom">Date From</label>
          <input type="date" id="dateFrom" />
        </div>

        <div class="control-group">
          <label class="control-label" for="dateTo">Date To</label>
          <input type="date" id="dateTo" />
        </div>

        <div class="control-group">
          <label class="control-label" for="centerFilter">Center</label>
          <select id="centerFilter">
            <option value="">All Centers</option>
          </select>
        </div>

        <div class="control-group">
          <label class="control-label" for="employeeFilter">Employee</label>
          <select id="employeeFilter">
            <option value="">All Employees</option>
          </select>
        </div>

        <div class="control-group">
          <label class="control-label" for="actionFilter">Action</label>
          <select id="actionFilter">
            <option value="">All Actions</option>
          </select>
        </div>

        <div class="control-group">
          <label class="control-label" for="searchInput">Search</label>
          <input
            type="text"
            id="searchInput"
            placeholder="Search name, page, action..."
          />
        </div>

        <div class="control-group control-actions">
          <button class="primary" id="applyFiltersBtn" type="button">
            Apply
          </button>

          <button class="secondary" id="clearFiltersBtn" type="button">
            Clear
          </button>

          <button class="secondary" id="exportCsvBtn" type="button">
            Export CSV
          </button>
        </div>

      </div>
    </section>

    <section class="report-panel">
      <div class="report-header">
        <h2>
          Activity Records
          <span id="resultCount" class="result-count"></span>
        </h2>

        <p class="table-note">
          Showing the latest 2000 activity records. Use filters to narrow results.
        </p>
      </div>

      <div class="table-wrapper">
        <table class="report-table activity-table">
          <thead>
            <tr>
              <th>Employee</th>
              <th>Date</th>
              <th>Time</th>
              <th>Center</th>
              <th>Page</th>
              <th>Action</th>
              <th>Details</th>
            </tr>
          </thead>

          <tbody id="activityTableBody">
            <tr>
              <td colspan="7" class="message-row">
                Loading activity logs...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script type="module" src="./employee-activity-log.js"></script>
  <script type="module" src="./activity-logger-init.js"></script>

</body>
</html>
