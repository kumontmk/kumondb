<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASHR Display — Kumon DB</title>
<link rel="stylesheet" href="ashr-stage.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stageHost { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .disp-ui { position: fixed; z-index: 60; transition: opacity .4s; }
  .disp-fs {
    right: 16px; bottom: 16px; width: 46px; height: 46px; border-radius: 12px; border: none;
    background: rgba(255,255,255,.14); color: #fff; font-size: 22px; cursor: pointer; backdrop-filter: blur(4px);
  }
  .disp-fs:hover { background: rgba(255,255,255,.3); }
  .disp-sound {
    right: 16px; bottom: 74px; border: none; border-radius: 999px; padding: .6rem 1.15rem;
    font-weight: 700; font-size: .9rem; background: #FFD700; color: #78350f; cursor: pointer;
    box-shadow: 0 4px 18px rgba(0,0,0,.45);
  }
  .disp-sound.armed { background: rgba(255,255,255,.14); color: #fff; padding: .4rem .7rem; font-size: .78rem; }
  .disp-conn { top: 16px; right: 18px; width: 11px; height: 11px; border-radius: 50%; background: #ef4444; }
  .disp-conn.on { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  /* Kiosk: hide UI + cursor after 3s idle (sound button stays until armed) */
  body.idle { cursor: none; }
  body.idle .disp-fs, body.idle .disp-conn, body.idle .disp-sound.armed { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <div id="stageHost"></div>
  <div id="connDot" class="disp-ui disp-conn" title="Live connection"></div>
  <button id="soundBtn" class="disp-ui disp-sound">🔊 Tap once to enable sound</button>
  <button id="fsBtn" class="disp-ui disp-fs" title="Fullscreen (F)">⛶</button>

  <script type="module" src="ashr-display.js"></script>
</body>
</html>
