<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="timecard.title">Timecard - Kumon DB</title>
  <link rel="stylesheet" href="timecard.css">
</head>
<body>
  <header>
    <nav>
      <a href="centers.html" data-i18n="timecard.backToCenters">← Centers</a>
    </nav>
    <nav>
          <h2 data-i18n="timecard.employeeTimecard">⏱️ Employee Timecard</h2>
    </nav>
  </header>

  <div class="container">
    <div class="attendance-controls">
      <div class="control-group">
        <label class="control-label" data-i18n="timecard.date">Date</label>
        <input type="date" id="datePicker" class="day-select">
      </div>

      <div class="search-group">
        <label class="control-label" data-i18n="timecard.search">Search</label>
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" data-i18n-placeholder="timecard.searchPlaceholder" placeholder="Search by name...">
        </div>
      </div>

      <div class="control-group">
        <label class="control-label" data-i18n="timecard.position">Position</label>
        <select id="positionFilter">
          <option value="" data-i18n="timecard.allPositions">All Positions</option>
          <option value="English Teacher" data-i18n="timecard.englishTeacher">English Teacher</option>
          <option value="Math Teacher" data-i18n="timecard.mathTeacher">Math Teacher</option>
          <option value="Chinese Teacher" data-i18n="timecard.chineseTeacher">Chinese Teacher</option>
          <option value="Admin" data-i18n="timecard.admin">Admin</option>
          <option value="Manager" data-i18n="timecard.manager">Manager</option>
        </select>
      </div>

      <div class="manual-qr-group">
        <label class="control-label" data-i18n="timecard.manualQr">Manual QR</label>
        <input type="text" id="manualQrInput" data-i18n-placeholder="timecard.enterQrCode" placeholder="Enter QR Code...">
        <button id="manualQrBtn" class="scan-btn" style="background: #6c757d; padding: 0.7rem 1rem;" data-i18n="timecard.submit">Submit</button>
      </div>

      <button id="startScanBtn" class="scan-btn" data-i18n="timecard.startQRScan">📷 Start QR Scan</button>
      <button id="startNfcBtn" class="nfc-btn" data-i18n="timecard.tapNFC">📡 Tap NFC to Clock In/Out (Android)</button>
    </div>

    <!-- DESKTOP + MANAGER-MOBILE: Table -->
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th data-i18n="timecard.chineseName">Chinese Name</th>
            <th data-i18n="timecard.englishName">English Name</th>
            <th data-i18n="timecard.position">Position</th>
            <th data-i18n="timecard.time">Time</th>
            <th data-i18n="timecard.center">Center</th>
            <th data-i18n="timecard.status">Status</th>
          </tr>
        </thead>
        <tbody id="timecardBody">
          <tr>
            <td colspan="6" class="empty-state" data-i18n="timecard.selectDate">Select a date to view attendance</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- EMPLOYEE-MOBILE ONLY: Cards (hidden by CSS otherwise) -->
    <div id="mobileTimecardCards"></div>
  </div>

  <!-- QR Scan Modal -->
  <div id="scanModal" class="modal hidden">
    <div class="modal-content">
      <button class="close-btn" id="closeScan">&times;</button>
      <h3 data-i18n="timecard.scanEmployeeQR">📷 Scan Employee QR</h3>
      <div id="reader"></div>
      <p data-i18n="timecard.positionQRFrame">Position QR in the frame</p>
      <button id="stopScanBtn" class="secondary" data-i18n="timecard.stopScanner">Stop Scanner</button>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script type="module" src="timecard-i18n.js"></script>
  <script type="module" src="timecard.js"></script>
</body>
</html>
