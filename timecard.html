<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Shows the logo in the browser tab -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Optional: PNG fallback for older browsers -->
  <link rel="icon" type="image/png" sizes="512x512" href="dblogo-maskable-512.png">

  <!-- Optional: icon when saved to iOS home screen -->
  <link rel="apple-touch-icon" href="dblogo-maskable-512.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="timecard.title">Timecard - Kumon DB</title>
  
  <!-- PWA manifest, favicon, and theme color -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <meta name="theme-color" content="#87CEEB">
  
  <link rel="stylesheet" href="timecard.css?v=3">
</head>
<body>
  <header>
    <nav><a href="centers.html" data-i18n="timecard.backToCenters">← Centers</a></nav>
    <nav><h2 data-i18n="timecard.employeeTimecard">⏱️ Employee Timecard</h2></nav>
  </header>


  <div class="container">

    <!-- 🛠️ MASTER ADMIN PANEL (kumonchamps only) -->
    <div id="adminClockPanel" class="admin-clock-panel hidden">
      <div class="acp-title">🛠️ Clock In / Out an Employee</div>
      <div class="acp-row">
        <label class="control-label" for="adminEmpSelect">Employee</label>
        <select id="adminEmpSelect" class="day-select"></select>
      </div>
      <div class="acp-row">
        <label class="control-label" for="adminCenterSelect">Center</label>
        <select id="adminCenterSelect" class="day-select"></select>
      </div>
      <div id="adminStatusLine" class="acp-status">—</div>
      <div class="acp-actions">
        <button id="adminClockInBtn" class="acp-btn in" type="button">Clock In</button>
        <button id="adminClockOutBtn" class="acp-btn out" type="button">Clock Out</button>
      </div>
    </div>

    <div class="attendance-controls">
      <div class="control-group">
        <label class="control-label" data-i18n="timecard.date">Date</label>
        <input type="date" id="datePicker" class="day-select">
      </div>
      <div class="search-group">
        <label class="control-label" data-i18n="timecard.search">Search</label>
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" data-i18n-placeholder="timecard.searchPlaceholder" placeholder="Search by name...">
        </div>
      </div>
      <div class="control-group">
        <label class="control-label" data-i18n="timecard.position">Position</label>
        <select id="positionFilter">
          <option value="" data-i18n="timecard.allPositions">All Positions</option>
          <option value="English Teacher" data-i18n="timecard.englishTeacher">English Teacher</option>
          <option value="Math Teacher" data-i18n="timecard.mathTeacher">Math Teacher</option>
          <option value="Chinese Teacher" data-i18n="timecard.chineseTeacher">Chinese Teacher</option>
          <option value="Admin" data-i18n="timecard.admin">Admin</option>
          <option value="Manager" data-i18n="timecard.manager">Manager</option>
        </select>
      </div>
    </div>

    <!-- 🔘 TAP TO LOG IN/OUT -->
    <div class="tap-button-wrapper">
    <div class="tap-button-hint" data-i18n="timecard.tapToLog">Tap to Log In/Out (iOS/Android)</div>
      <button id="tapLogBtn" class="tap-log-btn tap-in is-loading" type="button">
        <span class="tap-face">
          <div class="tap-spinner"></div>
          <svg class="tap-icon icon-in" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          <svg class="tap-icon icon-out" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          <span id="tapLogLabel" class="tap-log-label">Log In</span>
        </span>
      </button>
      <div class="tap-button-hint" data-i18n="timecard.tapOR">OR</div>
      <button id="startNfcBtn" class="nfc-btn" data-i18n="timecard.tapNFC">📡 Tap NFC to Clock In/Out (Android)</button>
    </div>

    <!-- DESKTOP + MANAGER-MOBILE: Table -->
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th data-i18n="timecard.chineseName">Chinese Name</th>
            <th data-i18n="timecard.englishName">English Name</th>
            <th data-i18n="timecard.position">Position</th>
            <th data-i18n="timecard.time">Time</th>
            <th data-i18n="timecard.center">Center</th>
            <th data-i18n="timecard.status">Status</th>
          </tr>
        </thead>
        <tbody id="timecardBody">
          <tr>
            <td colspan="6" class="empty-state" data-i18n="timecard.selectDate">Select a date to view attendance</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- EMPLOYEE-MOBILE ONLY: Cards (hidden by CSS otherwise) -->
    <div id="mobileTimecardCards"></div>
  </div>

  <!-- QR Scan Modal -->
  <div id="scanModal" class="modal hidden">
    <div class="modal-content">
      <button class="close-btn" id="closeScan">&times;</button>
      <h3 data-i18n="timecard.scanEmployeeQR">📷 Scan Employee QR</h3>
      <div id="reader"></div>
      <p data-i18n="timecard.positionQRFrame">Position QR in the frame</p>
      <button id="stopScanBtn" class="secondary" data-i18n="timecard.stopScanner">Stop Scanner</button>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script type="module" src="timecard-i18n.js"></script>
  <script type="module" src="timecard.js"></script>
</body>
</html>
